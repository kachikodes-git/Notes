<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap">
<style>
:root{--bg:#F3F4F6;--panel:#FFFFFF;--ink:#1B2430;--mute:#6B7685;--line:#E2E5EA;--accent:#2D5A4A;--on-accent:#FFFFFF;--sel:#EEF3F1;--danger:#A33A3A;
--ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Newsreader",Georgia,"Times New Roman",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181D;--panel:#1A1F26;--ink:#E7EAEE;--mute:#8F9AA8;--line:#2A313A;--accent:#86BBA3;--on-accent:#10201A;--sel:#202A29;--danger:#E08585}}
:root[data-theme="dark"]{--bg:#14181D;--panel:#1A1F26;--ink:#E7EAEE;--mute:#8F9AA8;--line:#2A313A;--accent:#86BBA3;--on-accent:#10201A;--sel:#202A29;--danger:#E08585}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:8px;padding:12px clamp(16px,4vw,32px);color:var(--mute);font-size:13px}
.meta{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:4px}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--mute)}
.ib:hover,.ib[aria-expanded="true"]{background:var(--panel);color:var(--ink)}
.ib.danger:hover{color:var(--danger)}
.sm{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.sm.danger{color:var(--danger);border-color:var(--danger)}
.hist{position:relative}
.drop{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 24px));max-height:65vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:6px;z-index:30;color:var(--ink)}
.search{width:calc(100% - 8px);margin:2px 4px 6px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.row{display:flex;align-items:center;gap:2px;border-radius:8px}
.row:hover{background:var(--bg)}
.row.on{background:var(--sel)}
.pick{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:9px 10px}
.pick b{display:block;font:500 16px/1.3 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick span{display:block;color:var(--mute);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:transparent;color:var(--mute);border-radius:6px;min-width:32px;height:32px;display:grid;place-items:center;font-size:12px;font-weight:600;padding:0 6px}
.x:hover{color:var(--danger)}
.x.ask{color:var(--danger)}
.note{color:var(--mute);font-size:12px;padding:8px 10px 4px;margin:0;border-top:1px solid var(--line)}
.none{color:var(--mute);font-size:14px;padding:10px}
.warn{background:var(--danger);color:#fff;font-size:13px;padding:8px 32px}
.sheet{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:8px clamp(20px,6vw,96px) 56px}
.title{border:0;background:transparent;font:500 40px/1.2 var(--nf,var(--serif));letter-spacing:-.015em;padding:4px 0 14px;width:100%}
.title:focus-visible,.ed:focus-visible{outline:none}
.title::placeholder{color:var(--mute);opacity:.6}
.ed{flex:1;min-height:50vh;font:400 20px/1.75 var(--nf,var(--serif));outline:none;word-break:break-word}
.ed:empty::before{content:attr(data-ph);color:var(--mute);opacity:.6}
.ed h2{font:500 1.4em/1.3 var(--nf,var(--serif));margin:1em 0 .3em}
.ed ul,.ed ol{margin:.4em 0;padding-left:1.6em}
.ed li{margin:.15em 0}
.ed b,.ed strong{font-weight:600}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.fmt{position:fixed;z-index:40;display:flex;align-items:center;gap:2px;padding:4px;background:var(--ink);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fmt button{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--bg);display:grid;place-items:center;font:600 15px var(--serif)}
.fmt button:hover{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.fmt button.on{background:var(--accent);color:var(--on-accent)}
.fmt i{width:1px;height:18px;background:color-mix(in srgb,var(--bg) 30%,transparent);margin:0 3px}
.left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.left .meta{flex:0 1 auto;margin-right:6px}.fdd{position:relative}.fbtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:14px;max-width:150px}.fbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fbtn:hover{border-color:var(--mute)}.fmenu{position:absolute;left:0;top:calc(100% + 8px);min-width:210px;list-style:none;margin:0;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:30}.fopt{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-size:17px;color:var(--ink);text-align:left}.fopt:hover{background:var(--bg)}.fopt.on{background:var(--sel);color:var(--accent)}.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);height:32px;overflow:hidden}.sb{width:28px;height:100%;border:0;background:transparent;color:var(--ink);font-size:16px;line-height:1}.sb:hover:not(:disabled){background:var(--sel)}.sb:disabled{opacity:.35;cursor:default}.sv{min-width:26px;text-align:center;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}.theme{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;flex-direction:column;align-items:flex-end;gap:10px}.fab{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}.fab:hover{border-color:var(--accent);color:var(--accent)}.tmenu{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:6px;min-width:150px}.topt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-size:14px;color:var(--ink);text-align:left}.topt:hover{background:var(--bg)}.topt.on{background:var(--sel);color:var(--accent)}@media (max-width:560px){.left .meta{display:none}.fbtn{max-width:104px}}@media (max-width:720px){.title{font-size:32px}.ed{font-size:18px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useMemo,useRef}=React;
const html=htm.bind(React.createElement);
const KEY="notes.v1";
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d))return d.map(n=>({id:n.id,title:n.title||"",body:n.body||"",html:n.html!=null?n.html:esc(n.body||"").replace(/\n/g,"<br>"),updated:n.updated||Date.now(),auto:n.auto||""}))}catch(e){}return[]}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MON=["Jan.","Feb.","Mar.","Apr.","May","Jun.","Jul.","Aug.","Sep.","Oct.","Nov.","Dec."];
const dateTitle=()=>{const d=new Date();return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()};
const blank=()=>{const t=dateTitle();return {id:uid(),title:t,auto:t,body:"",html:"",updated:Date.now()}};
const byNew=(a,b)=>b.updated-a.updated;
const isBlank=n=>!n.body.trim()&&(!n.title.trim()||n.title===n.auto);
function fmt(t){const d=new Date(t),n=new Date();
  if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  return d.toLocaleDateString([],{month:"short",day:"numeric",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"})}
const words=s=>{const m=s.trim().match(/\S+/g);return m?m.length:0};
const Ic=({children,s=20})=>html`<svg viewBox="0 0 24 24" width=${s} height=${s} fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${children}</svg>`;
const Clock=()=>html`<${Ic}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/><//>`;
const Plus=()=>html`<${Ic}><path d="M12 5v14M5 12h14"/><//>`;
const Trash=()=>html`<${Ic}><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/><//>`;
const Bul=()=>html`<${Ic}><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/><//>`;
const Num=()=>html`<${Ic}><path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1V9M4 14h3l-3 4h3"/><//>`;
const Chev=()=>html`<${Ic} s=${14}><path d="M6 9l6 6 6-6"/><//>`;
const Check=()=>html`<${Ic} s=${16}><path d="M5 12l5 5 9-10"/><//>`;
const Monitor=()=>html`<${Ic}><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><//>`;
const Sun=()=>html`<${Ic}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><//>`;
const Moon=()=>html`<${Ic}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/><//>`;
const THEMES=[{id:"system",label:"System",icon:Monitor},{id:"light",label:"Light",icon:Sun},{id:"dark",label:"Dark",icon:Moon}];
const FONTS=[{n:"Newsreader",f:'"Newsreader",Georgia,serif'},{n:"Lora",f:'"Lora",Georgia,serif'},{n:"Inter",f:'"Inter",system-ui,sans-serif'},{n:"Georgia",f:'Georgia,"Times New Roman",serif'},{n:"JetBrains Mono",f:'"JetBrains Mono",ui-monospace,Menlo,monospace'},{n:"Caveat",f:'"Caveat","Comic Sans MS",cursive'}];
const PK="notes.prefs.v1";
const loadPrefs=()=>{let p={};try{p=JSON.parse(localStorage.getItem(PK))||{}}catch(e){}return{font:p.font||"Newsreader",size:p.size||(window.innerWidth<=720?18:20),theme:p.theme||"system"}};

function App(){
  const init=useRef(null);
  if(!init.current){let l=load();if(!l.length)l=[blank()];init.current=l}
  const [notes,setNotes]=useState(init.current);
  const [activeId,setActive]=useState(()=>[...init.current].sort(byNew)[0].id);
  const [confirm,setConfirm]=useState(false);
  const [histOpen,setHist]=useState(false);
  const [hq,setHq]=useState("");
  const [pend,setPend]=useState(null);
  const [saveErr,setSaveErr]=useState(false);
  const [bar,setBar]=useState(null);
  const edRef=useRef(null),titleRef=useRef(null),histRef=useRef(null),fontRef=useRef(null),themeRef=useRef(null);
  const [prefs,setPrefs]=useState(loadPrefs);
  const [fontOpen,setFontOpen]=useState(false);
  const [themeOpen,setThemeOpen]=useState(false);
  const setP=p=>setPrefs(x=>({...x,...p}));

  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(notes));setSaveErr(false)}catch(e){setSaveErr(true)}},[notes]);
  useEffect(()=>{try{localStorage.setItem(PK,JSON.stringify(prefs))}catch(e){}const r=document.documentElement;if(prefs.theme==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",prefs.theme)},[prefs]);
  useEffect(()=>{
    if(!fontOpen&&!themeOpen)return;
    const d=e=>{if(fontRef.current&&!fontRef.current.contains(e.target))setFontOpen(false);if(themeRef.current&&!themeRef.current.contains(e.target))setThemeOpen(false)};
    const k=e=>{if(e.key==="Escape"){setFontOpen(false);setThemeOpen(false)}};
    document.addEventListener("mousedown",d);document.addEventListener("keydown",k);
    return()=>{document.removeEventListener("mousedown",d);document.removeEventListener("keydown",k)};
  },[fontOpen,themeOpen]);

  const sorted=useMemo(()=>[...notes].sort(byNew),[notes]);
  const active=notes.find(n=>n.id===activeId)||sorted[0];
  const rows=useMemo(()=>{const s=hq.trim().toLowerCase();
    return s?sorted.filter(n=>(n.title+" "+n.body).toLowerCase().includes(s)):sorted},[sorted,hq]);

  useEffect(()=>{if(edRef.current)edRef.current.innerHTML=active.html},[activeId]);

  useEffect(()=>{
    if(!histOpen)return;
    const d=e=>{if(histRef.current&&!histRef.current.contains(e.target))setHist(false)};
    const k=e=>{if(e.key==="Escape")setHist(false)};
    document.addEventListener("mousedown",d);document.addEventListener("keydown",k);
    return()=>{document.removeEventListener("mousedown",d);document.removeEventListener("keydown",k);setHq("");setPend(null)};
  },[histOpen]);

  useEffect(()=>{
    function sync(){
      const ed=edRef.current,s=getSelection();
      if(!ed||!s.rangeCount||s.isCollapsed||!ed.contains(s.anchorNode)||!ed.contains(s.focusNode)){setBar(null);return}
      const r=s.getRangeAt(0).getBoundingClientRect();
      const q=c=>{try{return document.queryCommandState(c)}catch(e){return false}};
      const below=r.top<64;
      setBar({x:Math.min(Math.max(r.left+r.width/2,170),window.innerWidth-170),y:below?r.bottom+10:r.top-10,below,
        st:{b:q("bold"),i:q("italic"),u:q("underline"),s:q("strikeThrough"),ul:q("insertUnorderedList"),ol:q("insertOrderedList"),
        h:/h2|heading/i.test(document.queryCommandValue("formatBlock")||"")}});
    }
    document.addEventListener("selectionchange",sync);
    return()=>document.removeEventListener("selectionchange",sync);
  },[]);

  function edit(patch){setNotes(ns=>ns.map(n=>n.id===activeId?{...n,...patch,updated:Date.now()}:n))}
  function onInput(){
    const ed=edRef.current;let h=ed.innerHTML;const t=ed.innerText;
    if(!t.trim()&&!/<(ul|ol|li)/.test(h)){ed.innerHTML="";h=""}
    edit({html:h,body:t});
  }
  const run=(c,v)=>{edRef.current.focus();document.execCommand(c,false,v);onInput()};
  function bump(d){
    const s=getSelection(),ed=edRef.current;
    if(!s.rangeCount||s.isCollapsed)return;
    let el=s.anchorNode;if(el.nodeType===3)el=el.parentElement;
    const px=Math.max(10,Math.min(96,Math.round((parseFloat(getComputedStyle(el).fontSize)||prefs.size)+d)));
    ed.focus();document.execCommand("fontSize",false,"7");
    const made=[];
    ed.querySelectorAll('font[size="7"],span[style*="xxx-large"]').forEach(f=>{let sp=f;if(f.nodeName==="FONT"){sp=document.createElement("span");while(f.firstChild)sp.appendChild(f.firstChild);f.replaceWith(sp)}sp.style.fontSize=px+"px";sp.querySelectorAll("span").forEach(x=>{x.style.fontSize=""});made.push(sp)});
    if(made.length){const r=document.createRange();r.setStartBefore(made[0]);r.setEndAfter(made[made.length-1]);s.removeAllRanges();s.addRange(r)}
    onInput();
  }

  function onKeyDown(e){
    if(e.key!==" "||e.metaKey||e.ctrlKey)return;
    const s=getSelection(),ed=edRef.current;
    if(!s.rangeCount||!s.isCollapsed||!s.anchorNode||s.anchorNode.nodeType!==3)return;
    const n=s.anchorNode,txt=n.textContent.slice(0,s.anchorOffset);
    const ul=/^[-*•]$/.test(txt),ol=/^\d+\.$/.test(txt);
    if(!ul&&!ol)return;
    let b=n.parentNode;while(b!==ed&&!/^(DIV|P|LI|H\d)$/.test(b.nodeName))b=b.parentNode;
    if(b.nodeName==="LI")return;
    if(b===ed?(n.textContent!==txt||n.previousSibling):b.textContent!==txt)return;
    e.preventDefault();
    const r=document.createRange();r.setStart(n,0);r.setEnd(n,s.anchorOffset);r.deleteContents();
    document.execCommand(ul?"insertUnorderedList":"insertOrderedList");
    onInput();
  }
  function onPaste(e){e.preventDefault();document.execCommand("insertText",false,e.clipboardData.getData("text/plain"))}

  function prune(keep){setNotes(ns=>{const r=ns.filter(n=>n.id===keep||!isBlank(n));return r.length?r:ns})}
  function newNote(){
    setConfirm(false);setHist(false);
    if(isBlank(active)){titleRef.current&&titleRef.current.focus();return}
    const n=blank();setNotes(ns=>[n,...ns]);setActive(n.id);
    setTimeout(()=>edRef.current&&edRef.current.focus(),30);
  }
  function open(id){setConfirm(false);setHist(false);if(id!==activeId){prune(id);setActive(id)}}
  function del(id){
    let rest=sorted.filter(n=>n.id!==id);
    if(!rest.length)rest=[blank()];
    setNotes(rest);setPend(null);setConfirm(false);
    if(id===activeId)setActive(rest[0].id);
  }
  const md=e=>e.preventDefault();
  const wc=words(active.body);
  const font=FONTS.find(f=>f.n===prefs.font)||FONTS[0];
  const cur=THEMES.find(t=>t.id===prefs.theme)||THEMES[0];

  return html`<div className="app">
    <header className="bar">
      <div className="left"><span className="meta">${isBlank(active)?"New note":"Edited "+fmt(active.updated)+" · "+wc+(wc===1?" word":" words")}</span>
        <div className="fdd" ref=${fontRef}>
          <button className="fbtn" title="Font" aria-label="Font family" aria-haspopup="listbox" aria-expanded=${fontOpen} onClick=${()=>setFontOpen(!fontOpen)}><span style=${{fontFamily:font.f}}>${font.n}</span><${Chev}/></button>
          ${fontOpen&&html`<ul className="fmenu" role="listbox">${FONTS.map(f=>html`<li key=${f.n}><button role="option" aria-selected=${f.n===font.n} className=${"fopt"+(f.n===font.n?" on":"")} style=${{fontFamily:f.f}} onClick=${()=>{setP({font:f.n});setFontOpen(false)}}>${f.n}${f.n===font.n&&html`<${Check}/>`}</button></li>`)}</ul>`}
        </div>
        <div className="step" role="group" aria-label="Default font size">
          <button className="sb" aria-label="Decrease default font size" title="Smaller" disabled=${prefs.size<=12} onClick=${()=>setP({size:prefs.size-1})}>−</button>
          <span className="sv" title="Default font size">${prefs.size}</span>
          <button className="sb" aria-label="Increase default font size" title="Larger" disabled=${prefs.size>=36} onClick=${()=>setP({size:prefs.size+1})}>+</button>
        </div></div>
      <div className="tools">
        <div className="hist" ref=${histRef}>
          <button className="ib" title="History" aria-label="History" aria-expanded=${histOpen} onClick=${()=>setHist(!histOpen)}><${Clock}/></button>
          ${histOpen&&html`<div className="drop">
            ${notes.length>=5&&html`<input className="search" type="search" placeholder="Search notes" aria-label="Search notes" autoFocus value=${hq} onChange=${e=>setHq(e.target.value)}/>`}
            ${rows.map(n=>html`<div key=${n.id} className=${"row"+(n.id===activeId?" on":"")}>
              <button className="pick" onClick=${()=>open(n.id)}>
                <b>${n.title.trim()||"Untitled"}</b>
                <span>${fmt(n.updated)} · ${n.body.replace(/\s+/g," ").trim().slice(0,60)||"No text"}</span>
              </button>
              <button className=${"x"+(pend===n.id?" ask":"")} title="Delete note" aria-label="Delete note" onClick=${()=>pend===n.id?del(n.id):setPend(n.id)}>${pend===n.id?"Delete?":html`<${Trash}/>`}</button>
            </div>`)}
            ${rows.length===0&&html`<p className="none">No notes match your search.</p>`}
            <p className="note">Notes are saved in this browser, on this device only.</p>
          </div>`}
        </div>
        <button className="ib" title="New note" aria-label="New note" onClick=${newNote}><${Plus}/></button>
        ${confirm
          ?html`<button className="sm danger" onClick=${()=>del(active.id)}>Delete note</button><button className="sm" onClick=${()=>setConfirm(false)}>Cancel</button>`
          :html`<button className="ib danger" title="Delete note" aria-label="Delete note" onClick=${()=>setConfirm(true)}><${Trash}/></button>`}
      </div>
    </header>
    <div className="theme" ref=${themeRef}>
      ${themeOpen&&html`<div className="tmenu" role="menu">${THEMES.map(t=>html`<button key=${t.id} role="menuitemradio" aria-checked=${prefs.theme===t.id} className=${"topt"+(prefs.theme===t.id?" on":"")} onClick=${()=>{setP({theme:t.id});setThemeOpen(false)}}><${t.icon}/>${t.label}</button>`)}</div>`}
      <button className="fab" title="Theme" aria-label="Theme" aria-expanded=${themeOpen} onClick=${()=>setThemeOpen(!themeOpen)}><${cur.icon}/></button>
    </div>
    ${saveErr&&html`<div className="warn" role="alert">Couldn’t save to this browser. Storage may be full or blocked.</div>`}
    <main className="sheet" style=${{"--nf":font.f}}>
      <input ref=${titleRef} className="title" placeholder="Title" aria-label="Note title" value=${active.title}
        onChange=${e=>edit({title:e.target.value})}
        onKeyDown=${e=>{if(e.key==="Enter"){e.preventDefault();edRef.current.focus()}}}/>
      <div ref=${edRef} className="ed" contentEditable="true" suppressContentEditableWarning=${true} role="textbox" aria-multiline="true" aria-label="Note text"
        style=${{fontSize:prefs.size+"px"}} data-ph="Start writing. Type - or 1. for a list, or select text to format it."
        onInput=${onInput} onKeyDown=${onKeyDown} onPaste=${onPaste}></div>
    </main>
    ${bar&&html`<div className="fmt" role="toolbar" aria-label="Format text" style=${{left:bar.x,top:bar.y,transform:bar.below?"translateX(-50%)":"translate(-50%,-100%)"}}>
      <button className=${bar.st.b?"on":""} title="Bold" aria-label="Bold" onMouseDown=${md} onClick=${()=>run("bold")}><b>B</b></button>
      <button className=${bar.st.i?"on":""} title="Italic" aria-label="Italic" onMouseDown=${md} onClick=${()=>run("italic")}><i style=${{width:"auto",height:"auto",background:"none",margin:0}}>I</i></button>
      <button className=${bar.st.u?"on":""} title="Underline" aria-label="Underline" onMouseDown=${md} onClick=${()=>run("underline")}><u>U</u></button>
      <button className=${bar.st.s?"on":""} title="Strikethrough" aria-label="Strikethrough" onMouseDown=${md} onClick=${()=>run("strikeThrough")}><s>S</s></button>
      <i></i>
      <button className=${bar.st.h?"on":""} title="Heading" aria-label="Heading" onMouseDown=${md} onClick=${()=>run("formatBlock",bar.st.h?"div":"h2")}>H</button>
      <button className=${bar.st.ul?"on":""} title="Bulleted list" aria-label="Bulleted list" onMouseDown=${md} onClick=${()=>run("insertUnorderedList")}><${Bul}/></button>
      <button className=${bar.st.ol?"on":""} title="Numbered list" aria-label="Numbered list" onMouseDown=${md} onClick=${()=>run("insertOrderedList")}><${Num}/></button>
      <i></i>
      <button title="Smaller text" aria-label="Smaller text" style=${{font:"600 13px var(--ui)"}} onMouseDown=${md} onClick=${()=>bump(-2)}>A−</button>
      <button title="Larger text" aria-label="Larger text" style=${{font:"600 13px var(--ui)"}} onMouseDown=${md} onClick=${()=>bump(2)}>A+</button>
    </div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
